<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JAGGAER AI Worker Console — Mockup</title>
<style>
:root{
  --purple:#6a2fb5; --purple-d:#4f2290; --purple-dd:#3d1a73; --purple-l:#f1eafb; --purple-m:#d9c8f2;
  --bg:#faf9f5; --side:#f2f0e9; --panel:#ffffff; --ink:#1f1e1d; --ink2:#5f5d58; --ink3:#8d8a82;
  --line:#e6e3da; --green:#1e8e5a; --amber:#b7791f; --red:#c0392b; --blue:#2563eb;
  --serif: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;overflow:hidden}
button{font:inherit;cursor:pointer;color:inherit}
.app{display:grid;grid-template-columns:292px minmax(0,1fr) 392px;height:100vh}
.app.nodock{grid-template-columns:292px minmax(0,1fr) 0}

/* ---------- sidebar ---------- */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 10px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--purple);color:#fff;display:grid;place-items:center;font-weight:700;font-family:var(--serif);font-size:17px}
.brand b{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.2px}
.brand small{display:block;color:var(--ink3);font-size:11px;margin-top:-2px}
.nav-btn{display:flex;align-items:center;gap:9px;margin:2px 8px;padding:7px 10px;border-radius:8px;border:0;background:none;width:calc(100% - 16px);text-align:left}
.nav-btn:hover{background:#e9e6dc}
.nav-btn.on{background:#e6dff4;color:var(--purple-d);font-weight:600}
.tree{flex:1;overflow:auto;padding:4px 0 12px;min-height:0}
.lbl{white-space:nowrap;display:flex;justify-content:space-between;align-items:center;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink3);padding:12px 18px 4px}
.lbl button{border:0;background:var(--purple-l);color:var(--purple-d);font-size:11px;border-radius:10px;padding:2px 8px;text-transform:none;letter-spacing:0}
.sup{margin:4px 0}
.sup-h{display:flex;align-items:center;gap:7px;margin:0 8px;padding:6px 10px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;border:0;background:none;width:calc(100% - 16px);text-align:left}
.sup-h:hover{background:#e9e6dc}.sup-h.on{background:#e6dff4;color:var(--purple-d)}
.sup-h .n{margin-left:auto;font-weight:500;color:var(--ink3);font-size:11px}
.dot{width:8px;height:8px;border-radius:2px;background:var(--purple);flex:none}
.wk{display:flex;align-items:center;gap:8px;margin:1px 8px 1px 26px;padding:5px 10px;border-radius:8px;border:0;background:none;width:calc(100% - 34px);text-align:left;font-size:13px}
.wk:hover{background:#e9e6dc}.wk.on{background:#e6dff4;color:var(--purple-d);font-weight:600}
.av{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--purple),#a46be0);color:#fff;font-size:10px;display:grid;place-items:center;flex:none}
.chev{width:12px;color:var(--ink3);font-size:10px;flex:none;transition:.15s}
.chev.open{transform:rotate(90deg)}
.sk{display:block;margin:1px 8px 1px 54px;padding:4px 10px;border-radius:7px;border:0;background:none;width:calc(100% - 62px);text-align:left;font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:2px solid var(--line);border-radius:0 7px 7px 0}
.sk:hover{background:#e9e6dc}.sk.on{background:#e6dff4;color:var(--purple-d);font-weight:600;border-left-color:var(--purple)}
.agentos{border-top:1px solid var(--line);background:#ece9df}
.aos-h{display:flex;align-items:center;gap:9px;padding:11px 16px;border:0;background:none;width:100%;text-align:left;font-weight:600}
.aos-h .tag{margin-left:auto;font-size:10px;background:var(--purple);color:#fff;border-radius:8px;padding:1px 7px;font-weight:600}
.aos-list{padding:0 8px 10px}
.aos-i{display:flex;gap:9px;align-items:center;width:100%;border:0;background:none;padding:6px 10px;border-radius:8px;text-align:left;font-size:13px}
.aos-i:hover{background:#e0dccf}.aos-i.on{background:#e6dff4;color:var(--purple-d);font-weight:600}
.aos-i i{font-style:normal;width:18px;text-align:center;color:var(--purple)}

.ico{display:inline-grid;place-items:center;color:#fff;flex:none;border-radius:6px}
.ico svg{width:62%;height:62%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.i-sup{background:#3d1a73}
.ico.i-wk{background:linear-gradient(135deg,#6a2fb5,#a46be0);border-radius:50%}
.ico.i-skill{background:#0f8a8a;clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%);border-radius:0}
.ico.i-agent{background:#b7791f}
.ico.i-task{background:#1e8e5a;border-radius:50%}
.legend{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.legend .li{display:flex;align-items:center;gap:8px}
.legend .li b{display:block;font-size:12px;line-height:1.1}.legend .li small{display:block;font-size:11px;color:var(--ink3)}
.legend .la{color:var(--ink3);font-size:18px}
.legend.side-l{flex-direction:column;align-items:stretch;gap:6px;margin:2px 10px 6px;padding:8px 10px;border-radius:10px;background:#f9f8f3}
.sk{display:flex!important;align-items:center;gap:6px}
.sk span{overflow:hidden;text-overflow:ellipsis}
.lbl span{display:flex;gap:4px}
.dg-wrap{overflow:auto;padding:6px 4px 20px;--gap:22px}
.dg-root{position:relative;width:250px;padding-bottom:18px}
.dg-stem0{position:absolute;left:22px;bottom:0;height:18px;border-left:2px solid var(--purple-m)}
.dg-cols{display:flex;gap:var(--gap);align-items:flex-start;width:max-content}
.dg-col{position:relative;width:250px}
.dg-cols.multi .dg-col:before{content:"";position:absolute;left:22px;top:-18px;height:18px;border-left:2px solid var(--purple-m)}
.dg-cols.multi .dg-col:not(:last-child):after{content:"";position:absolute;left:22px;top:-18px;width:calc(100% + var(--gap));border-top:2px solid var(--purple-m)}
.dg-node{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer;transition:.15s}
.dg-node:hover{border-color:var(--purple);box-shadow:0 4px 16px rgba(106,47,181,.15)}
.dg-node b{display:block;font-size:13px;line-height:1.2}.dg-node small{display:block;font-size:11px;color:var(--ink3)}
.dg-sup{background:var(--purple-l);border-color:var(--purple-m)}.dg-sup b{font-family:var(--serif);font-size:15px}
.dg-rt{background:var(--purple-dd);border-color:var(--purple-dd);color:#fff;cursor:default}.dg-rt small{color:#cdbbea}
.dg-wks{margin:0 0 0 22px;padding:12px 0 2px 14px;border-left:2px solid var(--purple-m);display:flex;flex-direction:column;gap:10px}
.dg-wk{position:relative;padding:7px 10px}
.dg-wk:before{content:"";position:absolute;left:-16px;top:50%;width:14px;border-top:2px solid var(--purple-m)}
/* ---------- main ---------- */
.main{overflow:auto;min-width:0;min-height:0}
.topbar{position:sticky;top:0;z-index:5;background:rgba(250,249,245,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 28px}
.crumbs{flex:1;min-width:0;color:var(--ink3);font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumbs a{color:var(--ink2);cursor:pointer}.crumbs a:hover{color:var(--purple)}
.crumbs b{color:var(--ink);font-weight:600}
.spacer{flex:1}
.btn{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:13px}
.btn:hover{border-color:var(--purple-m)}
.btn.p{background:var(--purple);border-color:var(--purple);color:#fff}.btn.p:hover{background:var(--purple-d)}
.page{max-width:1080px;margin:0 auto;padding:26px 28px 60px}
h1{font-family:var(--serif);font-weight:500;font-size:30px;margin:0 0 4px;letter-spacing:-.2px}
h2{font-family:var(--serif);font-weight:500;font-size:20px;margin:26px 0 10px}
h3{margin:0 0 6px;font-size:14px}
.sub{color:var(--ink2);margin:0 0 18px;max-width:760px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink2);white-space:nowrap}
.pill.g{background:#e7f6ee;color:var(--green);border-color:#bfe6d1}
.pill.a{background:#fdf3e1;color:var(--amber);border-color:#f2dcae}
.pill.r{background:#fdeceb;color:var(--red);border-color:#f3c4bf}
.pill.p{background:var(--purple-l);color:var(--purple-d);border-color:var(--purple-m)}
.pill.b{background:#e8f0fe;color:var(--blue);border-color:#c7d8fb}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;overflow-x:auto;min-width:0}
.tbl td,.tbl th{font-size:13px}
.card.click{cursor:pointer;transition:.15s}.card.click:hover{border-color:var(--purple);box-shadow:0 4px 18px rgba(106,47,181,.12);transform:translateY(-1px)}
.card h3{font-family:var(--serif);font-size:16px;font-weight:600}
.muted{color:var(--ink2)}.small{font-size:12px}.tiny{font-size:11px;color:var(--ink3)}
.kpi{padding:14px 16px}.kpi .v{font-family:var(--serif);font-size:28px;line-height:1.1}.kpi .l{color:var(--ink2);font-size:12px;margin-top:2px}
.kpi .d{font-size:11px;color:var(--green);margin-top:4px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid #f0eee7;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 16px}
.tab{border:0;background:none;padding:8px 14px;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--purple-d);border-bottom-color:var(--purple);font-weight:600}
.bar{height:8px;border-radius:6px;background:#eceae2;overflow:hidden}.bar i{display:block;height:100%;background:var(--purple);border-radius:6px}
.row{display:flex;gap:10px;align-items:center}.wrap{flex-wrap:wrap}.between{justify-content:space-between}
.hero{display:flex;gap:16px;align-items:flex-start}
.hero .av{width:52px;height:52px;font-size:20px;border-radius:14px}
.sec-title{display:flex;align-items:center;justify-content:space-between}
.search{display:flex;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:5px 5px 5px 14px;align-items:center}
.search input{flex:1;border:0;outline:0;font:inherit;background:none;padding:7px 0}
.banner{background:var(--purple-l);border:1px solid var(--purple-m);border-radius:10px;padding:10px 14px;margin-top:10px;display:flex;gap:10px;align-items:center}

/* skill composition */
.flow{display:grid;grid-template-columns:200px 1fr;gap:0;align-items:start;margin-top:8px}
.flow .root{background:var(--purple);color:#fff;border-radius:12px;padding:14px;position:sticky;top:70px}
.flow .root small{opacity:.8;display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.6px;font-size:10px}
.agents{border-left:2px solid var(--purple-m);margin-left:-1px;padding-left:26px;display:flex;flex-direction:column;gap:14px}
.agent{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.agent:before{content:"";position:absolute;left:-26px;top:26px;width:26px;border-top:2px solid var(--purple-m)}
.agent .hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.agent .ic{width:28px;height:28px;border-radius:8px;background:var(--purple-l);color:var(--purple);display:grid;place-items:center;font-size:14px}
.tasks{display:flex;gap:8px;flex-wrap:wrap;margin-left:38px}
.task{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;display:flex;align-items:center;gap:6px}

.task.tbd{border-style:dashed;color:var(--ink3)}

/* contract UI */
.clause{border-left:3px solid var(--line);padding:8px 12px;margin:8px 0;background:#fcfbf8;border-radius:0 8px 8px 0}
.clause.risk{border-left-color:var(--red);background:#fdf3f2}.clause.ok{border-left-color:var(--green)}
mark{background:#fbd9d5;padding:0 2px;border-radius:3px}
.sug{background:var(--purple-l);border:1px solid var(--purple-m);border-radius:8px;padding:8px 10px;margin-top:6px;font-size:13px}
/* spend chart */
.chart{display:flex;align-items:flex-end;gap:14px;height:170px;padding:10px 6px 0;border-bottom:1px solid var(--line)}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.chart .c i{width:100%;max-width:54px;background:var(--purple);border-radius:6px 6px 0 0;opacity:.85}
.chart .c i.hl{background:#a46be0}
.chart .c span{font-size:11px;color:var(--ink2)}
.lbls{display:flex;gap:14px;padding:6px;font-size:11px;color:var(--ink2)}.lbls span{flex:1;text-align:center}
.q{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:6px;height:230px}
.q div{border-radius:10px;padding:10px;font-size:12px;background:var(--purple-l);border:1px solid var(--purple-m)}
.q div b{display:block;margin-bottom:4px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:99;font-size:13px;box-shadow:0 8px 28px rgba(0,0,0,.25)}
.form label{display:block;font-size:12px;font-weight:600;margin:14px 0 4px}
.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit;background:#fff}
.form input:focus,.form select:focus,.form textarea:focus{outline:2px solid var(--purple-m);border-color:var(--purple)}

/* ---------- JAI dock ---------- */
.dock{background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.nodock .dock{display:none}
.dock-h{background:linear-gradient(90deg,var(--purple-dd),var(--purple));color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
.dock-h .jl{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.dock-h b{display:block;font-size:15px;line-height:1.1}.dock-h small{opacity:.8;font-size:11px}
.dock-h button{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:6px;width:26px;height:26px}
.dock-h button:hover{background:rgba(255,255,255,.28)}
.ctx{padding:8px 14px;background:var(--purple-l);border-bottom:1px solid var(--purple-m);font-size:12px;color:var(--purple-d);display:flex;gap:6px;align-items:center}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px;background:#fcfbfe}
.m{display:flex;gap:8px;max-width:100%}
.m .av{margin-top:2px}
.bub{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13px;max-width:100%}
.m.u{justify-content:flex-end}.m.u .bub{background:#2f6bdc;color:#fff;border-color:#2f6bdc}
.opt{border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-top:8px;background:#fff}
.opt.best{border:2px solid #7bc99e;background:#f2fbf6}
.opt .t{font-weight:600;font-size:13px}.opt .s{font-size:11px;color:var(--ink2)}
.opt .pr{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.opt .pr b{font-size:16px;color:var(--purple-d)}
.opt button{border:1px solid var(--purple);background:#fff;color:var(--purple);border-radius:7px;padding:3px 12px;font-size:12px}
.opt.best button{background:var(--purple);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px 0;background:#fcfbfe}
.chip{border:1px solid var(--purple-m);background:#fff;color:var(--purple-d);border-radius:999px;padding:4px 11px;font-size:12px}
.chip:hover{background:var(--purple-l)}
.compose{display:flex;gap:8px;padding:10px 14px 14px;background:#fcfbfe}
.compose input{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit}
.compose input:focus{outline:2px solid var(--purple-m);border-color:var(--purple)}
.compose button{background:var(--purple);border:0;color:#fff;border-radius:10px;width:40px}
.typing{display:flex;gap:4px;padding:6px 2px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--purple-m);animation:b 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}
.dock-fab{position:fixed;right:20px;bottom:20px;background:var(--purple);color:#fff;border:0;border-radius:999px;padding:12px 18px;font-weight:600;box-shadow:0 8px 24px rgba(106,47,181,.4);display:none;z-index:20}
.nodock .dock-fab{display:block}
@media (max-width:1100px){
  .app,.app.nodock{grid-template-columns:260px minmax(0,1fr)}
  .dock{position:fixed;right:0;top:0;bottom:0;width:min(400px,100%);z-index:30;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .app,.app.nodock{grid-template-columns:1fr}
  .side{display:none}.g2,.g3,.g4{grid-template-columns:1fr}
  .flow{grid-template-columns:1fr}.agents{padding-left:14px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="brand"><div class="logo">J</div><div><b>JAGGAER</b><small>AI Worker Console</small></div></div>
    <button class="nav-btn" id="navHome" onclick="go({})">⌂ &nbsp;Overview</button>
    <div class="tree" id="tree"></div>
    <div class="agentos" id="aos"></div>
  </aside>
  <main class="main" id="main"></main>
  <aside class="dock" id="dock">
    <div class="dock-h">
      <div class="jl">✦</div>
      <div><b>JAI</b><small>Guided Buying · Intake &amp; Orchestration</small></div>
      <span class="spacer"></span>
      <button title="Clear chat" onclick="resetChat()">↺</button>
      <button title="Close dock" onclick="toggleDock(false)">✕</button>
    </div>
    <div class="ctx" id="ctx"></div>
    <div class="msgs" id="msgs"></div>
    <div class="chips" id="chips"></div>
    <form class="compose" onsubmit="send(event)">
      <input id="inp" placeholder="Ask JAI or describe what you need…" autocomplete="off">
      <button aria-label="Send">➤</button>
    </form>
  </aside>
</div>
<button class="dock-fab" onclick="toggleDock(true)">✦ Ask JAI</button>

<script src="data.js"></script>
<script src="ui.js"></script>
</body>
</html>
